<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/livres.css">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Bibliotheque-Livres</title>
</head>
<body>
    <header>
        <h1>Bibliotheque de Quartier</h1>

        <nav>
            <a href="../index.html">Tableau de bord</a>
            <a href="livres.html">Livres</a>
            <a href="adherents.html">adherents</a>
            <a href="auteurs.html">Auteurs</a>
            <a href="emprunts.html">Emprunts</a>
        </nav>
    </header>

    <main>
        <h2>Gestion des livres</h2>

        <form action="" id="form-livre">
            <input type="text" id="titre" placeholder="titre du livre" required>
            <input type="text" id="annee-publication" placeholder="annee_publication">

            <select name="" id="auteur_id">
                <option value="">selectionne un auteur</option>
            </select>
            <button type="submit">ajouter un livre</button>
        </form>
        <!--bare de recherche-->
        <div class="search-bar">
            <input type="text" id="recherche" placeholder="recherche par titre ou auteur">
            <button type="button" id="btn-recherche">recherche</button>
        </div>
        <!--listes des auteurs-->
        <ul id="liste-livres"></ul>
    </main>


<script src="../js/api.js"></script>
<script src="../js/livres.js"></script>
</body>
</html>
